<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario | NEXA Hub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/portal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<!--
    Calendario del cliente — solo lectura.
    Muestra únicamente los eventos de sus proyectos (RLS).
    Crear / editar / eliminar es exclusivo del administrador.
-->
<body class="dash-page" data-auth-guard="client">

    <div class="dash-shell">

        <aside class="dash-sidebar" id="dashSidebar">

            <a href="../index.html" class="dash-logo">
                <img src="../assets/logo/nexa-logo.png" alt="Nexa Logo">
            </a>

            <nav class="dash-nav">

                <a href="index.html" class="dash-nav-item">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/>
                        <rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/>
                        <rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/>
                        <rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                    Resumen
                </a>

                <a href="proyectos.html" class="dash-nav-item">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9 18l-5.4 2.2a1 1 0 0 1-1.4-.9V6.6a1 1 0 0 1 .6-.9L9 3m0 15V3m0 15l6 3m-6-18l6 3m0 0l5.4-2.2a1 1 0 0 1 1.4.9v12.7a1 1 0 0 1-.6.9L15 21m0-18v18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Ruta NEXA
                </a>

                <a href="tareas.html" class="dash-nav-item">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/>
                        <path d="M8 12.3l2.5 2.5L16 9.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Tareas
                </a>

                <a href="calendario.html" class="dash-nav-item active">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/>
                        <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                    Calendario
                </a>

                <a href="configuracion.html" class="dash-nav-item">
                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/>
                        <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4M17.7 17.7l-1.4-1.4M7.7 7.7L6.3 6.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                    Configuración
                </a>

            </nav>

            <a href="../portal/index.html" class="dash-logout" data-logout>
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M15 17l5-5-5-5M20 12H9M12 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Cerrar sesión
            </a>

        </aside>

        <div class="dash-overlay" id="dashOverlay"></div>

        <div class="dash-content">

            <div class="dash-topbar">
                <button class="dash-menu-toggle" id="dashMenuToggle" aria-label="Abrir menú">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <a href="../index.html" class="dash-topbar-logo">
                    <img src="../assets/logo/nexa-logo.png" alt="Nexa Logo">
                </a>
            </div>

            <main class="dash-main-inner">

                <div class="dash-page-title">
                    <h1>Calendario</h1>
                    <p>Reuniones, entregas e hitos de tus proyectos con NEXA.</p>
                </div>

                <div class="cal-layout">

                    <section class="cal-panel">
                        <div class="cal-toolbar">
                            <div class="cal-toolbar-nav">
                                <button type="button" class="dash-btn-outline" id="calPrevBtn" aria-label="Mes anterior">‹</button>
                                <h2 id="calMonthLabel">—</h2>
                                <button type="button" class="dash-btn-outline" id="calNextBtn" aria-label="Mes siguiente">›</button>
                            </div>
                            <button type="button" class="dash-btn-outline" id="calTodayBtn">Hoy</button>
                        </div>
                        <p id="calLoadingState" style="color:#7a7a7a; font-size:13px;">Cargando eventos...</p>
                        <div id="calGrid" class="cal-grid"></div>
                    </section>

                    <aside class="cal-side">
                        <h3>Próximos eventos</h3>
                        <div id="calUpcomingList" class="cal-side-list"></div>
                        <p class="dash-empty-inline" id="calUpcomingEmpty" style="display:none;">No hay eventos próximos este mes.</p>
                    </aside>

                </div>

            </main>

        </div>

    </div>

    <div class="dash-modal-overlay" id="eventDetailModalOverlay">
        <div class="dash-modal" role="dialog" aria-modal="true">
            <div class="dash-modal-header">
                <h3 id="eventDetailTitle">Evento</h3>
                <button type="button" class="dash-modal-close" id="eventDetailModalClose">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <span id="eventDetailType" style="font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;"></span>
            <div class="dash-meta-row" style="margin-top:14px;">
                <div class="dash-meta-item">
                    <span>Cuándo</span>
                    <strong id="eventDetailWhen">—</strong>
                </div>
                <div class="dash-meta-item">
                    <span>Proyecto</span>
                    <strong id="eventDetailProject">—</strong>
                </div>
                <div class="dash-meta-item">
                    <span>Ubicación</span>
                    <strong id="eventDetailLocation">—</strong>
                </div>
            </div>
            <p id="eventDetailDescription" style="color:#c9c9c9; font-size:13.5px; line-height:1.7; margin-top:16px;"></p>
            <div id="eventDetailLinkWrap" style="display:none; margin-top:14px;">
                <a id="eventDetailLink" href="#" target="_blank" rel="noopener" class="dash-btn-small">Abrir enlace de reunión</a>
            </div>
        </div>
    </div>

    <script src="../js/vendor/supabase-js.min.js"></script>
    <script src="../js/portal.js"></script>
    <script type="module" src="../js/dashboard/pages/calendarioPage.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contraseña | NEXA Hub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/portal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<!--
    Pantalla obligatoria de cambio de contraseña temporal.
    Se muestra cuando el usuario autenticado tiene
    user_metadata.must_change_password = true (ver js/portal.js).
    No es accesible sin una sesión activa: si no hay sesión,
    redirige a /portal. Si la contraseña ya fue cambiada,
    redirige directo al dashboard.
-->
<body class="portal-page">

    <div class="portal-bg"></div>

    <div class="portal-shell">

        <a href="../index.html" class="portal-logo">
            <img src="../assets/logo/nexa-logo.png" alt="Nexa Logo">
        </a>

        <div class="portal-card">

            <span class="portal-badge">
                <span class="badge-dot"></span>
                NEXA HUB
            </span>

            <h1 class="portal-title">Bienvenido a NEXA Hub</h1>

            <p class="portal-subtitle">
                Por seguridad, debes cambiar tu contraseña temporal
                antes de continuar.
            </p>

            <form id="changePasswordForm" class="portal-form" novalidate>

                <div class="portal-field">
                    <label for="newPassword">Nueva contraseña</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                </div>

                <div class="portal-field">
                    <label for="confirmPassword">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu nueva contraseña" autocomplete="new-password">
                </div>

                <span class="portal-error" id="changePasswordError"></span>

                <button type="submit" class="portal-submit">
                    Cambiar contraseña
                    <span class="btn-arrow">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </button>

            </form>

            <div class="portal-help">
                <span>¿Problemas para acceder?</span>
                <a href="../pages/contacto.html">Contacta a tu asesor NEXA.</a>
            </div>

        </div>

    </div>

    <script src="../js/vendor/supabase-js.min.js"></script>
    <script src="../js/portal.js"></script>

</body>
</html>

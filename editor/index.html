<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi trabajo | NEXA Editor</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/employees.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-page editor-shell" data-auth-guard="employee">
    <div class="admin-shell editor-layout">
        <aside class="admin-sidebar editor-sidebar" id="adminSidebar">
            <a href="../index.html" class="admin-logo">
                <img src="../assets/logo/nexa-logo.png" alt="Nexa Logo">
                <span class="admin-logo-tag">HUB · EDITOR</span>
            </a>
            <nav class="admin-nav editor-nav">
                <button type="button" class="admin-nav-item active" data-editor-view="trabajo">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    Mi trabajo
                </button>
                <button type="button" class="admin-nav-item" data-editor-view="ajustes">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4M17.7 17.7l-1.4-1.4M7.7 7.7L6.3 6.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    Ajustes
                </button>
            </nav>
            <button type="button" class="admin-logout" data-logout>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M12 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Cerrar sesión
            </button>
        </aside>
        <div class="admin-overlay" id="adminOverlay"></div>
        <div class="admin-content">
            <header class="admin-topbar">
                <div class="admin-topbar-left">
                    <button class="admin-menu-toggle" id="adminMenuToggle" aria-label="Abrir menú">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <div>
                        <span class="emp-kicker" style="margin:0">Espacio de trabajo</span>
                        <strong id="editorTopTitle" style="color:#fff;font-size:15px;display:block">Mi trabajo</strong>
                    </div>
                </div>
                <div class="admin-topbar-right">
                    <span class="emp-chip" id="editorUserChip">Director</span>
                </div>
            </header>
            <main class="admin-main" id="editorRoot"></main>
        </div>
    </div>
    <script src="../js/vendor/supabase-js.min.js"></script>
    <script type="module" src="../js/portal.js"></script>
    <script type="module" src="../js/admin.js"></script>
    <script type="module" src="../js/editor/misProyectosPage.js"></script>
</body>
</html>
